<!DOCTYPE html>
<html>
<head>
  <title>Dungeon Delver</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

  <!-- Load the Three.js library -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    // =====================================================
    // DUNGEON DELVER - Phase 4: Stable Camera
    // =====================================================

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.5, 6);
    camera.lookAt(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const torchLight = new THREE.PointLight(0xffaa55, 100, 50);
    torchLight.position.set(0, 7, 0);
    scene.add(torchLight);

    const moonLight = new THREE.DirectionalLight(0xaaaaff, 0.5);
    moonLight.position.set(5, 10, 5);
    scene.add(moonLight);

    // --- FLOOR ---
    const roomSize = 30;
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(roomSize, roomSize),
      new THREE.MeshStandardMaterial({ color: 0x666666 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // --- WALL SYSTEM ---
    const walls = [];
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x554433 });
    const wallHeight = 3;

    function createWall(x, z, width, depth) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(width, wallHeight, depth), wallMaterial);
      wall.position.set(x, wallHeight / 2, z);
      wall.userData = {
        minX: x - width / 2, maxX: x + width / 2,
        minZ: z - depth / 2, maxZ: z + depth / 2
      };
      scene.add(wall);
      walls.push(wall);
      return wall;
    }

    // Outer walls
    createWall(0, -roomSize / 2, roomSize, 0.5);
    createWall(0, roomSize / 2, roomSize, 0.5);
    createWall(-roomSize / 2, 0, 0.5, roomSize);
    createWall(roomSize / 2, 0, 0.5, roomSize);

    // Interior walls
    createWall(-5, -5, 8, 0.5);
    createWall(5, 5, 0.5, 8);
    createWall(-8, 6, 0.5, 6);
    createWall(8, -6, 6, 0.5);

    // --- THE KNIGHT ---
    const knightRadius = 0.4;
    const knight = new THREE.Mesh(
      new THREE.CapsuleGeometry(knightRadius, 0.8, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x4488ff })
    );
    knight.position.set(0, 0.8, 0);
    scene.add(knight);

    // --- THE SWORD ---
    const sword = new THREE.Group();

    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.08, 1.0),
      new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 })
    );
    blade.position.set(0, 0, -0.5);
    sword.add(blade);

    const hilt = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.12, 0.25),
      new THREE.MeshStandardMaterial({ color: 0x6b3410 })
    );
    hilt.position.set(0, 0, 0.15);
    sword.add(hilt);

    const guard = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 0.1, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
    );
    sword.add(guard);

    sword.position.set(0.5, 0, -0.3);
    sword.rotation.y = -0.3;
    knight.add(sword);

    // --- ENEMIES ---
    const enemies = [];

    function createSlime(x, z) {
      const slime = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 12, 8),
        new THREE.MeshStandardMaterial({ color: 0x44dd44, roughness: 0.4 })
      );
      slime.position.set(x, 0.6, z);
      slime.userData = {
        health: 5, isAlive: true, isDying: false, deathTimer: 0,
        hitFlashTimer: 0, normalColor: 0x44dd44,
        knockbackX: 0, knockbackZ: 0, knockbackTimer: 0, radius: 0.6
      };
      scene.add(slime);
      enemies.push(slime);
      return slime;
    }

    createSlime(-10, -10);
    createSlime(10, 10);
    createSlime(-10, 10);

    function isPositionBlocked(x, z, radius) {
      for (let i = 0; i < walls.length; i++) {
        const w = walls[i].userData;
        if (x + radius > w.minX && x - radius < w.maxX &&
            z + radius > w.minZ && z - radius < w.maxZ) return true;
      }
      return false;
    }

    // --- SWORD SWING STATE ---
    let isSwinging = false, swingTimer = 0, hasHitThisSwing = false, cooldownTimer = 0;
    const swingDuration = 0.08, swingCooldown = 0.03, hitRange = 1.5, swordDamage = 1;

    function startSwing() {
      if (isSwinging || cooldownTimer > 0) return;
      isSwinging = true;
      swingTimer = 0;
      hasHitThisSwing = false;
    }

    // --- KEYBOARD INPUT ---
    const keys = { up: false, down: false, left: false, right: false };

    function setKey(event, isPressed) {
      const key = event.key;
      if (key === 'ArrowUp' || key === 'w' || key === 'W') keys.up = isPressed;
      if (key === 'ArrowDown' || key === 's' || key === 'S') keys.down = isPressed;
      if (key === 'ArrowLeft' || key === 'a' || key === 'A') keys.left = isPressed;
      if (key === 'ArrowRight' || key === 'd' || key === 'D') keys.right = isPressed;
      if (key === ' ' && isPressed && !event.repeat) startSwing();
    }

    window.addEventListener('keydown', (event) => setKey(event, true));
    window.addEventListener('keyup', (event) => setKey(event, false));

    const moveSpeed = 0.15;

    // --- THE GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (cooldownTimer > 0) cooldownTimer -= 1 / 60;

      // Enemy effects
      for (let i = 0; i < enemies.length; i++) {
        const enemy = enemies[i];

        if (enemy.userData.isDying) {
          enemy.userData.deathTimer += 1 / 60;
          const progress = enemy.userData.deathTimer / 1.5;
          if (progress >= 1) {
            scene.remove(enemy);
            enemy.userData.isDying = false;
          } else {
            const flatten = 1 - progress;
            const spread = 1 + progress * 0.8;
            const shrink = 1 - progress;
            enemy.scale.y = flatten * 0.5;
            enemy.scale.x = spread * shrink;
            enemy.scale.z = spread * shrink;
            enemy.position.y = 0.6 * flatten;
          }
          continue;
        }

        if (!enemy.userData.isAlive) continue;

        if (enemy.userData.hitFlashTimer > 0) {
          enemy.userData.hitFlashTimer -= 1 / 60;
          if (enemy.userData.hitFlashTimer <= 0) {
            enemy.material.color.setHex(enemy.userData.normalColor);
          }
        }

        if (enemy.userData.knockbackTimer > 0) {
          enemy.userData.knockbackTimer -= 1 / 60;
          const nx = enemy.position.x + enemy.userData.knockbackX;
          const nz = enemy.position.z + enemy.userData.knockbackZ;
          if (!isPositionBlocked(nx, enemy.position.z, enemy.userData.radius)) {
            enemy.position.x = nx;
          } else enemy.userData.knockbackX = 0;
          if (!isPositionBlocked(enemy.position.x, nz, enemy.userData.radius)) {
            enemy.position.z = nz;
          } else enemy.userData.knockbackZ = 0;
          enemy.userData.knockbackX *= 0.85;
          enemy.userData.knockbackZ *= 0.85;
        }
      }

      // --- MOVEMENT: WORLD-RELATIVE (no feedback loop!) ---
      let moveX = 0;
      let moveZ = 0;
      if (keys.up) moveZ -= 1;
      if (keys.down) moveZ += 1;
      if (keys.left) moveX += 1;
      if (keys.right) moveX -= 1;

      const isMoving = (moveX !== 0 || moveZ !== 0);

      if (isMoving) {
        const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
        moveX /= length;
        moveZ /= length;
      }

      const newX = knight.position.x + moveX * moveSpeed;
      const newZ = knight.position.z + moveZ * moveSpeed;
      if (!isPositionBlocked(newX, knight.position.z, knightRadius)) knight.position.x = newX;
      if (!isPositionBlocked(knight.position.x, newZ, knightRadius)) knight.position.z = newZ;

      // Visual rotation (does NOT affect movement!)
      if (isMoving) {
        const targetRotation = Math.atan2(moveX, moveZ) + Math.PI;
        let angleDiff = targetRotation - knight.rotation.y;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        knight.rotation.y += angleDiff * 0.1;
      }

      // Sword swing + hit detection
      if (isSwinging) {
        swingTimer += 1 / 60 / swingDuration;

        if (swingTimer >= 1) {
          isSwinging = false;
          swingTimer = 0;
          cooldownTimer = swingCooldown;
          sword.rotation.y = -0.3;
        } else {
          sword.rotation.y = -1.5 + swingTimer * 3.0;
        }

        if (!hasHitThisSwing) {
          for (let i = 0; i < enemies.length; i++) {
            const enemy = enemies[i];
            if (!enemy.userData.isAlive) continue;
            const distance = knight.position.distanceTo(enemy.position);
            if (distance < hitRange) {
              enemy.userData.health -= swordDamage;
              hasHitThisSwing = true;
              console.log("HIT! Slime HP:", enemy.userData.health);
              enemy.userData.hitFlashTimer = 0.15;
              enemy.material.color.setHex(0xff4444);

              const kx = enemy.position.x - knight.position.x;
              const kz = enemy.position.z - knight.position.z;
              const kl = Math.sqrt(kx * kx + kz * kz);
              enemy.userData.knockbackX = (kx / kl) * 0.3;
              enemy.userData.knockbackZ = (kz / kl) * 0.3;
              enemy.userData.knockbackTimer = 0.2;

              if (enemy.userData.health <= 0) {
                enemy.userData.isAlive = false;
                enemy.userData.isDying = true;
                enemy.userData.deathTimer = 0;
                console.log("Slime defeated! Melting...");
              }
              break;
            }
          }
        }
      }

      // --- CAMERA: chase camera behind the knight ---
      const cameraDistance = 6;
      const cameraHeight = 3.5;
      const cameraSmoothness = 0.05;

      const knightAngle = knight.rotation.y;
      const targetCameraX = knight.position.x + Math.sin(knightAngle) * cameraDistance;
      const targetCameraZ = knight.position.z + Math.cos(knightAngle) * cameraDistance;

      camera.position.x += (targetCameraX - camera.position.x) * cameraSmoothness;
      camera.position.y = knight.position.y + cameraHeight;
      camera.position.z += (targetCameraZ - camera.position.z) * cameraSmoothness;
      camera.lookAt(knight.position.x, 1.6, knight.position.z);

      renderer.render(scene, camera);
    }
    animate();

  </script>

</body>
</html>
