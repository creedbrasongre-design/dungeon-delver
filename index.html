<!DOCTYPE html>
<html>
<head>
  <title>Dungeon Delver</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #fadeOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: black; opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease; z-index: 100;
    }
    #hearts { position: fixed; top: 12px; left: 14px; font-size: 30px; letter-spacing: 3px; z-index: 50; user-select: none; }
    #keys   { position: fixed; top: 54px; left: 16px; font-size: 22px; color: #ffdd55; font-family: sans-serif; z-index: 50; user-select: none; }
    #coins  { position: fixed; top: 84px; left: 16px; font-size: 22px; color: #ffcc00; font-family: sans-serif; z-index: 50; user-select: none; }
    #ammo   { position: fixed; top: 114px; left: 16px; font-size: 22px; color: #cde; font-family: sans-serif; z-index: 50; user-select: none; }
    #roomLabel { position: fixed; top: 12px; right: 16px; font-size: 18px; color: #cfd6e6; font-family: sans-serif; z-index: 50; user-select: none; text-align: right; }
    #message {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      font-family: sans-serif; font-size: 22px; color: #fff;
      background: rgba(0,0,0,0.6); padding: 10px 18px; border-radius: 10px;
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 60;
    }
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 26px; height: 26px; border: 2px solid rgba(255,255,255,0.85); border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.15s ease;
      pointer-events: none; z-index: 60;
    }
    #crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
      background: #fff; border-radius: 50%; transform: translate(-50%,-50%);
    }
  </style>
</head>
<body>

  <div id="fadeOverlay"></div>
  <div id="hearts"></div>
  <div id="keys"></div>
  <div id="coins"></div>
  <div id="ammo"></div>
  <div id="roomLabel"></div>
  <div id="crosshair"></div>
  <div id="message"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    // =====================================================
    // DUNGEON DELVER - Phase 17: Desert Region + Grass
    // =====================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const fadeOverlay = document.getElementById('fadeOverlay');

    // --- LIGHTING ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const torchLight = new THREE.PointLight(0xffaa55, 140, 60);
    torchLight.position.set(0, 6.5, 0);
    scene.add(torchLight);
    const sunLight = new THREE.DirectionalLight(0xffffff, 0.7);
    sunLight.position.set(20, 40, 15);
    scene.add(sunLight);

    // --- FLOOR (scaled per room) ---
    const roomSize = 30;
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(roomSize, roomSize),
      new THREE.MeshStandardMaterial({ color: 0x666666 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // --- CEILING (hidden outdoors) ---
    const wallHeight = 7;
    const ceiling = new THREE.Mesh(
      new THREE.PlaneGeometry(roomSize, roomSize),
      new THREE.MeshStandardMaterial({ color: 0x3a3a3a, side: THREE.DoubleSide })
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = wallHeight;
    scene.add(ceiling);

    // --- WALLS (optional HEIGHT param) ---
    const walls = [];
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x554433 });

    function createWall(x, z, width, depth, height) {
      height = height || wallHeight;
      const minThickness = 1.3;
      if (width < minThickness) width = minThickness;
      if (depth < minThickness) depth = minThickness;
      const wall = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wallMaterial);
      wall.position.set(x, height / 2, z);
      wall.userData = { minX:x-width/2, maxX:x+width/2, minZ:z-depth/2, maxZ:z+depth/2 };
      scene.add(wall);
      walls.push(wall);
      return wall;
    }

    // --- PITS ---
    const pits = [];
    function createPit(x, z, size) {
      const pit = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ color: 0x000000 }));
      pit.rotation.x = -Math.PI / 2;
      pit.position.set(x, 0.01, z);
      pit.userData = { minX:x-size/2, maxX:x+size/2, minZ:z-size/2, maxZ:z+size/2 };
      scene.add(pit);
      pits.push(pit);
      return pit;
    }

    // --- DECORATION PROPS (trees / grass / cacti) ---
    const props = [];
    function createTree(x, z) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 2, 8),
        new THREE.MeshStandardMaterial({ color: 0x6b4a2b }));
      trunk.position.y = 1; g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3.2, 10),
        new THREE.MeshStandardMaterial({ color: 0x2f7d32 }));
      leaves.position.y = 3.4; g.add(leaves);
      g.position.set(x, 0, z);
      scene.add(g); props.push(g); return g;
    }
    // ALL grass blades live in ONE InstancedMesh = ONE draw call (no lag, even with thousands)
    let grassMesh = null;
    function buildGrass(clumpCount, size) {
      const bladesPerClump = 7;
      const total = clumpCount * bladesPerClump;
      const geo = new THREE.ConeGeometry(0.13, 1.2, 4); // bigger, taller blade
      geo.translate(0, 0.6, 0);                          // sit it on the ground
      const mat = new THREE.MeshStandardMaterial({ color: 0x3f9a3a, roughness: 1 });
      grassMesh = new THREE.InstancedMesh(geo, mat, total);
      const dummy = new THREE.Object3D();                // helper to build each blade's position
      let idx = 0;
      for (let c = 0; c < clumpCount; c++) {
        const cx = (Math.random()-0.5)*(size-10);
        const cz = (Math.random()-0.5)*(size-10);
        for (let b = 0; b < bladesPerClump; b++) {
          dummy.position.set(cx + (Math.random()-0.5)*2.4, 0, cz + (Math.random()-0.5)*2.4);
          dummy.rotation.set((Math.random()-0.5)*0.4, Math.random()*Math.PI, (Math.random()-0.5)*0.4);
          const s = 0.8 + Math.random()*0.9;
          dummy.scale.set(s, s, s);
          dummy.updateMatrix();
          grassMesh.setMatrixAt(idx++, dummy.matrix);
        }
      }
      grassMesh.instanceMatrix.needsUpdate = true;
      scene.add(grassMesh);
    }

    // A grass-LOOKING floor: it's drawn once as the ground, so this costs nothing extra.
    let grassTexture = null;
    function makeGrassTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#4a8a3a'; ctx.fillRect(0, 0, 128, 128);     // base green
      const greens = ['#3f9a3a','#5aa84a','#3a7d32','#6bbd55','#2f7d2a'];
      for (let i = 0; i < 1600; i++) {                              // paint tiny blades
        ctx.strokeStyle = greens[(Math.random()*greens.length)|0];
        const x = Math.random()*128, y = Math.random()*128, len = 2 + Math.random()*4;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random()-0.5)*2, y - len); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;                 // tile it across the ground
      return tex;
    }
    function createCactus(x, z) {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x3a7d4a, roughness: 0.8 });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 2.6, 8), mat);
      body.position.y = 1.3; g.add(body);
      const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 1, 8), mat);
      armL.position.set(-0.55, 1.4, 0); armL.rotation.z = 0.5; g.add(armL);
      const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 1, 8), mat);
      armR.position.set(0.55, 1.7, 0); armR.rotation.z = -0.5; g.add(armR);
      g.position.set(x, 0, z);
      scene.add(g); props.push(g); return g;
    }

    // --- CLOUDS ---
    const clouds = [];
    function createCloud(x, y, z) {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0x223044, emissiveIntensity: 0.4 });
      const puffs = [ [0,0,0,3], [3,-0.4,0,2.2], [-3,-0.3,0,2.4], [1.4,0.6,1.8,2], [-1.4,0.5,-1.8,2.1] ];
      for (const p of puffs) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(p[3], 8, 6), mat);
        s.position.set(p[0], p[1], p[2]);
        g.add(s);
      }
      g.position.set(x, y, z);
      g.userData = { driftSpeed: 0.01 + Math.random() * 0.03 };
      scene.add(g); clouds.push(g); return g;
    }

    // --- KNIGHT ---
    const knightRadius = 0.4;
    const knight = new THREE.Mesh(
      new THREE.CapsuleGeometry(knightRadius, 0.8, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x4488ff })
    );
    knight.position.set(0, 0.8, 0);
    scene.add(knight);

    const spawnPoint = { x: 0, z: 0, y: 0.8 };

    // --- SWORD ---
    const sword = new THREE.Group();
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.0),
      new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 }));
    blade.position.set(0, 0, -0.5); sword.add(blade);
    const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.25),
      new THREE.MeshStandardMaterial({ color: 0x6b3410 }));
    hilt.position.set(0, 0, 0.15); sword.add(hilt);
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.1, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
    sword.add(guard);
    sword.position.set(0.5, 0, -0.3);
    sword.rotation.y = -0.3;
    knight.add(sword);

    // --- ENEMY TYPES ---
    const ENEMY_TYPES = {
      greenSlime: { color: 0x44dd44, health: 5, speed: 0.05625, radius: 0.6,  damage: 1, shape: 'slime', sightRange: 9 },
      redSlime:   { color: 0xff5533, health: 3, speed: 0.09,    radius: 0.55, damage: 1, shape: 'slime', sightRange: 11 },
      blueSlime:  { color: 0x55ccff, health: 6, speed: 0.035,   radius: 0.65, damage: 1, shape: 'slime', sightRange: 8 },
      ogre:       { color: 0x998877, health: 8, speed: 0.045,   radius: 0.9,  damage: 2, shape: 'ogre',  sightRange: 12 },
      eye:        { color: 0xaa55cc, health: 4, speed: 0.03,    radius: 0.5,  damage: 1, shape: 'eye',
                    ranged: true, meleeImmune: true, standoff: 7, sightRange: 14 },
    };

    // --- ENEMIES ---
    const enemies = [];
    function createEnemy(typeName, x, z, isBoss) {
      const type = ENEMY_TYPES[typeName];
      let geometry, baseY;
      if (type.shape === 'ogre') { geometry = new THREE.BoxGeometry(1.6, 2.4, 1.6); baseY = 1.2; }
      else if (type.shape === 'eye') { geometry = new THREE.SphereGeometry(type.radius, 14, 10); baseY = 1.9; }
      else { geometry = new THREE.SphereGeometry(type.radius, 12, 8); baseY = type.radius; }

      const enemy = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: type.color, roughness: 0.4 }));
      enemy.position.set(x, baseY, z);

      if (type.shape === 'eye') {
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(type.radius * 0.45, 10, 8),
          new THREE.MeshStandardMaterial({ color: 0x110011 }));
        pupil.position.set(0, 0, -type.radius * 0.7);
        enemy.add(pupil);
      }

      enemy.userData = {
        type: typeName,
        health: type.health, isAlive: true, isDying: false, deathTimer: 0,
        hitFlashTimer: 0, normalColor: type.color,
        knockbackX: 0, knockbackZ: 0, knockbackTimer: 0,
        radius: type.radius, speed: type.speed, damage: type.damage, baseY: baseY,
        isBoss: false, id: null,
        ranged: !!type.ranged, meleeImmune: !!type.meleeImmune,
        standoff: type.standoff || 7, shootTimer: 1 + Math.random() * 1.5,
        sightRange: type.sightRange || 10
      };
      if (isBoss) {
        enemy.userData.isBoss = true;
        enemy.userData.health = 20;
        enemy.userData.sightRange = 999;
        const bossColor = 0x884466;
        enemy.userData.normalColor = bossColor;
        enemy.material.color.setHex(bossColor);
      }
      scene.add(enemy);
      enemies.push(enemy);
      return enemy;
    }

    function isPositionBlocked(x, z, radius) {
      for (let i = 0; i < walls.length; i++) {
        const w = walls[i].userData;
        if (x + radius > w.minX && x - radius < w.maxX && z + radius > w.minZ && z - radius < w.maxZ) return true;
      }
      return false;
    }
    function isOverPit(x, z) {
      for (let i = 0; i < pits.length; i++) {
        const p = pits[i].userData;
        if (x > p.minX && x < p.maxX && z > p.minZ && z < p.maxZ) return true;
      }
      return false;
    }

    // --- DOORS ---
    const doors = [];
    function createDoor(d) {
      const color = d.locked ? 0xffcc33 : 0x7a4a1e;
      const door = new THREE.Mesh(new THREE.BoxGeometry(2, 3.2, 0.4),
        new THREE.MeshStandardMaterial({ color: color }));
      door.position.set(d.x, 1.6, d.z);
      door.rotation.y = d.rot;
      door.userData = { to: d.to, arriveX: d.arriveX, arriveZ: d.arriveZ, locked: d.locked, id: null };
      scene.add(door);
      doors.push(door);
      return door;
    }

    // --- STAIRS ---
    const stairsList = [];
    function createStairs(s) {
      const group = new THREE.Group();
      const stepColor = (s.dir === 'down') ? 0x6f7785 : 0x9aa2b2;
      const stepMat = new THREE.MeshStandardMaterial({ color: stepColor, roughness: 0.8 });
      for (let i = 0; i < 5; i++) {
        const step = new THREE.Mesh(new THREE.BoxGeometry(2, 0.25, 0.6), stepMat);
        step.position.set(0, 0.125 + i * 0.25, -i * 0.5);
        group.add(step);
      }
      group.position.set(s.x, 0, s.z);
      group.rotation.y = s.rot || 0;
      group.userData = { to: s.to, arriveX: s.arriveX, arriveZ: s.arriveZ, dir: s.dir };
      scene.add(group);
      stairsList.push(group);
      return group;
    }

    // --- PORTALS + GATEWAYS ---
    const portals = [];
    function createPortal(p) {
      if (p.comingSoon) {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x8a8a96, roughness: 0.9 });
        const left  = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), mat); left.position.set(-1.2, 1.5, 0); g.add(left);
        const right = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), mat); right.position.set(1.2, 1.5, 0); g.add(right);
        const top   = new THREE.Mesh(new THREE.BoxGeometry(3, 0.6, 0.6), mat); top.position.set(0, 3, 0); g.add(top);
        g.position.set(p.x, 0, p.z);
        g.userData = { comingSoon: true, name: p.name || 'Side' };
        scene.add(g); portals.push(g); return g;
      }
      const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.25, 24),
        new THREE.MeshStandardMaterial({ color: p.color || 0x66ddff, emissive: p.emissive || 0x2299cc, emissiveIntensity: 0.8 }));
      pad.position.set(p.x, 0.13, p.z);
      pad.userData = { to: p.to, arriveX: p.arriveX, arriveZ: p.arriveZ, comingSoon: false };
      scene.add(pad); portals.push(pad); return pad;
    }

    // --- PICKUPS ---
    const items = [];
    function createPickup(kind, x, z) {
      let mesh, baseY;
      if (kind === 'key') {
        mesh = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.09, 8, 16),
          new THREE.MeshStandardMaterial({ color: 0xffdd33, metalness: 0.6, roughness: 0.3 })); baseY = 0.8;
      } else if (kind === 'heart') {
        mesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10),
          new THREE.MeshStandardMaterial({ color: 0xff3355, roughness: 0.4 })); baseY = 0.7;
      } else if (kind === 'coin') {
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.07, 16),
          new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.7, roughness: 0.3 }));
        mesh.rotation.x = Math.PI / 2; baseY = 0.7;
      } else if (kind === 'arrow') {
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.8, 8),
          new THREE.MeshStandardMaterial({ color: 0xddaa55, roughness: 0.5 }));
        mesh.rotation.z = Math.PI / 2; baseY = 0.6;
      } else {
        mesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8),
          new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.7, roughness: 0.25 })); baseY = 0.9;
      }
      mesh.position.set(x, baseY, z);
      mesh.userData = { kind: kind, baseY: baseY, id: null, final: false, final2: false };
      scene.add(mesh);
      items.push(mesh);
      return mesh;
    }

    // --- CHESTS ---
    const chests = [];
    function createChest(x, z, reward, opened) {
      const chest = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.7),
        new THREE.MeshStandardMaterial({ color: opened ? 0x4a3520 : 0x9a6a2a, roughness: 0.6, metalness: 0.2 }));
      chest.position.set(x, 0.35, z);
      chest.userData = { reward: reward, opened: opened, id: null };
      scene.add(chest);
      chests.push(chest);
      return chest;
    }

    // --- ARROWS ---
    const arrows = [];
    const arrowSpeed = 0.55, arrowDamage = 2;
    function spawnArrow(yaw, pitch) {
      const hX = -Math.sin(yaw), hZ = -Math.cos(yaw);
      const dirX = hX * Math.cos(pitch), dirZ = hZ * Math.cos(pitch), dirY = Math.sin(pitch);
      const a = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.8, 6),
        new THREE.MeshStandardMaterial({ color: 0xffeeaa, roughness: 0.4 }));
      a.position.set(knight.position.x + dirX * 0.6, 1.3 + dirY * 0.6, knight.position.z + dirZ * 0.6);
      a.rotation.order = 'YXZ'; a.rotation.y = yaw; a.rotation.x = Math.PI / 2 - pitch;
      a.userData = { vx: dirX * arrowSpeed, vy: dirY * arrowSpeed, vz: dirZ * arrowSpeed, life: 160 };
      scene.add(a); arrows.push(a);
    }

    // --- ENEMY SHOTS ---
    const enemyShots = [];
    const shotSpeed = 0.22;
    function spawnEnemyShot(x, y, z, tx, tz) {
      const dx = tx - x, dz = tz - z;
      const len = Math.sqrt(dx * dx + dz * dz) || 1;
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0xff66dd, emissive: 0x660044, emissiveIntensity: 0.6 }));
      s.position.set(x, y, z);
      s.userData = { vx: (dx / len) * shotSpeed, vz: (dz / len) * shotSpeed, life: 200 };
      scene.add(s); enemyShots.push(s);
    }

    // --- INVENTORY + UI ---
    let playerKeys = 0, playerCoins = 0, hasBow = false, playerArrows = 0;
    const keysUI = document.getElementById('keys');
    const coinsUI = document.getElementById('coins');
    const ammoUI = document.getElementById('ammo');
    const roomLabelUI = document.getElementById('roomLabel');
    const messageUI = document.getElementById('message');
    const crosshairUI = document.getElementById('crosshair');
    let messageTimer = 0;

    function updateKeysUI()  { keysUI.textContent  = (playerKeys  > 0) ? ('\uD83D\uDD11 x ' + playerKeys)  : ''; }
    function updateCoinsUI() { coinsUI.textContent = ('\uD83E\uDE99 ' + playerCoins); }
    function updateAmmoUI()  { ammoUI.textContent  = hasBow ? ('\uD83C\uDFF9 ' + playerArrows + (aiming ? '   \uD83C\uDFAF AIM (IJKL)' : '')) : ''; }
    function showMessage(text, seconds) { messageUI.textContent = text; messageUI.style.opacity = '1'; messageTimer = seconds; }

    // --- PROGRESS ---
    const progress = {
      defeatedBosses: new Set(), takenKeys: new Set(), tookTreasure: new Set(),
      unlockedDoors: new Set(), openedChests: new Set()
    };

    // --- ROOMS ---
    const ROOMS = {
      // ============ OVERWORLD: MAIN REGION (big grassland) ============
      mainland: {
        label: 'Hyralia Fields - Main Region',
        outdoor: true, size: 200, grass: true,
        floorColor: 0x4a8a3a, wallColor: 0x8f897e, bg: 0x87b6e8,
        walls: [], pits: [],
        enemies: [
          ['greenSlime',18,18], ['greenSlime',-25,12], ['redSlime',40,-20],
          ['blueSlime',-30,-35], ['greenSlime',55,30], ['redSlime',-55,40], ['ogre',30,55]
        ],
        trees: [
          [20,40],[-30,30],[50,10],[-50,-10],[15,-40],[-20,55],[60,-30],[-60,-40],
          [40,60],[-45,45],[70,20],[-70,15],[25,-60],[-25,-65],[80,-15],[-80,-25],
          [10,75],[-15,80],[90,40],[-90,30],[35,-80],[-40,-85]
        ],
        portals: [
          { x:0, z:-25, to:'start', arriveX:0, arriveZ:0, color:0x66ff99, emissive:0x229955 }, // cave -> Dungeon 1
          { x:75, z:0, to:'desert_field', arriveX:0, arriveZ:15, color:0xe0c060, emissive:0x886622 }, // -> Desert
          { x:-75, z:0,   comingSoon:true, name:'Forest' },
          { x:0,   z:75,  comingSoon:true, name:'Snowpeak' },
          { x:-55, z:-60, comingSoon:true, name:'Volcano' },
          { x:55,  z:60,  comingSoon:true, name:'Swamp' }
        ],
        keys:[], chests:[], treasures:[]
      },

      // ============ OVERWORLD: DESERT REGION ============
      desert_field: {
        label: 'Gerudo Sands - Desert Region',
        outdoor: true, size: 120,
        floorColor: 0xd8c081, wallColor: 0xb8a878, bg: 0xbcd0dc,

    // --- ROOM LOADING ---
    let currentRoomId = null;
    let currentRoomSize = roomSize;
    let transitionCooldown = 0;

    function clearRoom() {
      for (const w of walls) scene.remove(w);
      for (const p of pits) scene.remove(p);
      for (const e of enemies) scene.remove(e);
      for (const d of doors) scene.remove(d);
      for (const s of stairsList) scene.remove(s);
      for (const pr of portals) scene.remove(pr);
      for (const it of items) scene.remove(it);
      for (const c of chests) scene.remove(c);
      for (const a of arrows) scene.remove(a);
      for (const sh of enemyShots) scene.remove(sh);
      for (const pp of props) scene.remove(pp);
      for (const cl of clouds) scene.remove(cl);
      if (grassMesh) { scene.remove(grassMesh); grassMesh.geometry.dispose(); grassMesh.material.dispose(); grassMesh = null; }
      walls.length=0; pits.length=0; enemies.length=0; doors.length=0;
      stairsList.length=0; portals.length=0; items.length=0; chests.length=0;
      arrows.length=0; enemyShots.length=0; props.length=0; clouds.length=0;
    }

    function loadRoom(roomId, arriveX, arriveZ) {
      clearRoom();
      const room = ROOMS[roomId];
      currentRoomId = roomId;

      const S = room.size || roomSize;
      currentRoomSize = S;
      floor.scale.set(S / roomSize, S / roomSize, 1);
      ceiling.scale.set(S / roomSize, S / roomSize, 1);
      ceiling.visible = !room.outdoor;

      if (room.grass) {
        if (!grassTexture) grassTexture = makeGrassTexture();
        floor.material.map = grassTexture;
        grassTexture.repeat.set(S / 10, S / 10);   // one grass tile per ~10 units
        floor.material.color.setHex(0xffffff);      // white = show the texture's real colors
      } else {
        floor.material.map = null;                  // dungeons/desert keep their flat color
        floor.material.color.setHex(room.floorColor !== undefined ? room.floorColor : 0x666666);
      }
      floor.material.needsUpdate = true;
      wallMaterial.color.setHex(room.wallColor !== undefined ? room.wallColor : 0x554433);
      ceiling.material.color.setHex(room.ceilColor !== undefined ? room.ceilColor : 0x3a3a3a);
      scene.background.setHex(room.bg !== undefined ? room.bg : 0x111111);
      roomLabelUI.textContent = room.label || '';

      const bh = room.outdoor ? 2.5 : wallHeight;
      createWall(0, -S/2, S, 0.5, bh);
      createWall(0,  S/2, S, 0.5, bh);
      createWall(-S/2, 0, 0.5, S, bh);
      createWall( S/2, 0, 0.5, S, bh);

      for (const w of room.walls) createWall(w[0], w[1], w[2], w[3]);
      for (const p of room.pits) createPit(p[0], p[1], p[2]);
      for (const t of (room.trees||[])) createTree(t[0], t[1]);
      for (const c of (room.cacti||[])) createCactus(c[0], c[1]);

      // grass: every blade packed into a single InstancedMesh (one draw call, lag-free)
      if (room.grass) buildGrass(room.grassClumps || 250, S);
      // clouds for outdoor regions
      if (room.outdoor) {
        for (let i = 0; i < 14; i++) createCloud((Math.random()-0.5)*S, 24 + Math.random()*14, (Math.random()-0.5)*S);
      }

      (room.enemies || []).forEach((e, idx) => {
        const id = roomId + ':enemy:' + idx;
        const isBoss = e[3];
        if (isBoss && progress.defeatedBosses.has(id)) return;
        const enemy = createEnemy(e[0], e[1], e[2], isBoss);
        enemy.userData.id = id;
      });
      (room.doors || []).forEach((d, idx) => {
        const id = roomId + ':door:' + idx;
        const lockedNow = d.locked && !progress.unlockedDoors.has(id);
        const door = createDoor({ x:d.x, z:d.z, rot:d.rot, to:d.to, arriveX:d.arriveX, arriveZ:d.arriveZ, locked:lockedNow });
        door.userData.id = id;
      });
      for (const s of (room.stairs||[])) createStairs(s);
      (room.portals||[]).forEach((p) => createPortal(p));
      (room.keys || []).forEach((k, idx) => {
        const id = roomId + ':key:' + idx;
        if (progress.takenKeys.has(id)) return;
        const item = createPickup('key', k[0], k[1]); item.userData.id = id;
      });
      (room.arrows||[]).forEach((aPos) => createPickup('arrow', aPos[0], aPos[1]));
      (room.chests||[]).forEach((c, idx) => {
        const id = roomId + ':chest:' + idx;
        const opened = progress.openedChests.has(id);
        const chest = createChest(c[0], c[1], c[2], opened); chest.userData.id = id;
      });
      (room.treasures||[]).forEach((t, idx) => {
        const id = roomId + ':treasure:' + idx;
        if (progress.tookTreasure.has(id)) return;
        const item = createPickup('treasure', t[0], t[1]); item.userData.id = id;
      });

      knight.position.set(arriveX, spawnPoint.y, arriveZ);
      spawnPoint.x = arriveX; spawnPoint.z = arriveZ;
      transitionCooldown = 0.5;
      if (roomId === 'des_entry' && !hasBow) showMessage('Open the chest to claim the BOW!', 2.5);
      if (roomId === 'mainland') showMessage('Main Region. Green cave (north) = Dungeon 1. East gate = the Desert.', 3.5);
      if (roomId === 'desert_field') showMessage('Gerudo Sands. A dungeon lies to the south.', 3);
    }

    // --- KNIGHT STATE ---
    // --- KNIGHT STATE ---
    let knightState = 'alive';
    let fallTimer = 0;
    const fallDuration = 1.0;
    function startFalling() { if (knightState !== 'alive') return; knightState = 'falling'; fallTimer = 0; }
    function respawnKnight() {
      knightState = 'respawning'; knight.visible = true; fadeOverlay.style.opacity = '1';
      setTimeout(() => {
        knight.position.set(spawnPoint.x, spawnPoint.y, spawnPoint.z);
        knight.rotation.set(0, 0, 0); knight.scale.set(1, 1, 1); knight.visible = true;
        knightHealth = maxHearts; invincibleTimer = 0; updateHearts();
        fadeOverlay.style.opacity = '0';
        setTimeout(() => { knightState = 'alive'; }, 400);
      }, 400);
    }

    // --- HEALTH ---
    const maxHearts = 5;
    let knightHealth = maxHearts, invincibleTimer = 0;
    const invincibleDuration = 1.0;
    let blinkTimer = 0;
    const heartsUI = document.getElementById('hearts');
    function updateHearts() {
      let display = '';
      for (let i = 0; i < maxHearts; i++) display += (i < knightHealth) ? '\u2764\uFE0F' : '\uD83E\uDD0D';
      heartsUI.textContent = display;
    }
    function takeDamage(amount) {
      if (knightState !== 'alive') return;
      if (invincibleTimer > 0) return;
      knightHealth -= amount; invincibleTimer = invincibleDuration; updateHearts();
      if (knightHealth <= 0) respawnKnight();
    }

    // --- SHARED DAMAGE/DEATH ---
    function damageEnemy(enemy, amount, srcX, srcZ) {
      enemy.userData.health -= amount;
      enemy.userData.hitFlashTimer = 0.15;
      enemy.material.color.setHex(0xffffff);
      const kx = enemy.position.x - srcX, kz = enemy.position.z - srcZ;
      const kl = Math.sqrt(kx*kx + kz*kz) || 1;
      enemy.userData.knockbackX = (kx/kl) * 0.3; enemy.userData.knockbackZ = (kz/kl) * 0.3;
      enemy.userData.knockbackTimer = 0.2;
      if (enemy.userData.health <= 0) {
        enemy.userData.isAlive = false; enemy.userData.isDying = true; enemy.userData.deathTimer = 0;
        if (enemy.userData.isBoss) {
          progress.defeatedBosses.add(enemy.userData.id);
          const t = createPickup('treasure', enemy.position.x, enemy.position.z);
          if (currentRoomId === 'crown')   t.userData.final  = true;
          if (currentRoomId === 'des_boss') t.userData.final2 = true;
          showMessage('The boss is defeated! It dropped the treasure!', 2.5);
        } else {
          const roll = Math.random();
          if (roll < 0.25) createPickup('heart', enemy.position.x, enemy.position.z);
          else if (roll < 0.55) createPickup('coin', enemy.position.x, enemy.position.z);
        }
      }
    }

    // --- COMBAT STATE ---
    let isSwinging = false, swingTimer = 0, hasHitThisSwing = false, cooldownTimer = 0;
    const swingDuration = 0.08, swingCooldown = 0.0001, hitRange = 2, swordDamage = 1;
    function startSwing() {
      if (knightState !== 'alive') return;
      if (isSwinging || cooldownTimer > 0) return;
      isSwinging = true; swingTimer = 0; hasHitThisSwing = false;
    }

    // --- BOW + AIM ---
    let aiming = false, aimYaw = 0, aimPitch = 0, arrowCooldown = 0;
    function shootArrow() {
      if (knightState !== 'alive') return;
      if (!hasBow) { showMessage('You need the bow first!', 1.2); return; }
      if (playerArrows <= 0) { showMessage('Out of arrows!', 1.2); return; }
      if (arrowCooldown > 0) return;
      spawnArrow(knight.rotation.y + aimYaw, aimPitch);
      playerArrows -= 1; updateAmmoUI();
      arrowCooldown = 0.25;
    }

    // --- KEYBOARD ---
    const keys = { up:false, down:false, left:false, right:false,
                   aimUp:false, aimDown:false, aimLeft:false, aimRight:false };
    function setKey(event, isPressed) {
      const key = event.key;
      if (key === 'ArrowUp' || key === 'w' || key === 'W') keys.up = isPressed;
      if (key === 'ArrowDown' || key === 's' || key === 'S') keys.down = isPressed;
      if (key === 'ArrowLeft' || key === 'a' || key === 'A') keys.left = isPressed;
      if (key === 'ArrowRight' || key === 'd' || key === 'D') keys.right = isPressed;
      if (key === 'i' || key === 'I') keys.aimUp = isPressed;
      if (key === 'k' || key === 'K') keys.aimDown = isPressed;
      if (key === 'j' || key === 'J') keys.aimLeft = isPressed;
      if (key === 'l' || key === 'L') keys.aimRight = isPressed;
      if (key === ' ' && isPressed && !event.repeat) startSwing();
      if (key === '/' && isPressed && !event.repeat) { event.preventDefault(); shootArrow(); }
      if (key === '.' && isPressed && !event.repeat) {
        event.preventDefault();
        aiming = !aiming; aimYaw = 0; aimPitch = 0;
        crosshairUI.style.opacity = aiming ? '1' : '0';
        updateAmmoUI();
      }
    }
    window.addEventListener('keydown', (event) => setKey(event, true));
    window.addEventListener('keyup', (event) => setKey(event, false));

    const moveSpeed = 0.23;

    // --- CAMERA ---
    const cameraDistance = 6, cameraHeight = 3.5, minCamDist = 1.8, camClearance = 0.6;
    let currentCamDist = cameraDistance;
    camera.position.set(0, knight.position.y + cameraHeight, cameraDistance);
    camera.lookAt(0, 1.6, 0);

    // --- START ---
    updateHearts(); updateKeysUI(); updateCoinsUI(); updateAmmoUI();
    loadRoom('mainland', 0, 0);

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (cooldownTimer > 0) cooldownTimer -= 1/60;
      if (arrowCooldown > 0) arrowCooldown -= 1/60;
      if (transitionCooldown > 0) transitionCooldown -= 1/60;
      if (messageTimer > 0) { messageTimer -= 1/60; if (messageTimer <= 0) messageUI.style.opacity = '0'; }

      for (const it of items) { it.rotation.y += 0.05; it.position.y = it.userData.baseY + Math.sin(Date.now()*0.004)*0.12; }
      for (const pr of portals) { if (!pr.userData.comingSoon) pr.rotation.y += 0.03; }

      for (const c of clouds) {
        c.position.x += c.userData.driftSpeed;
        if (c.position.x > currentRoomSize/2 + 25) c.position.x = -currentRoomSize/2 - 25;
      }

      // --- arrows ---
      for (let i = arrows.length - 1; i >= 0; i--) {
        const a = arrows[i];
        a.position.x += a.userData.vx; a.position.y += a.userData.vy; a.position.z += a.userData.vz;
        a.userData.life--;
        let gone = false;
        if (isPositionBlocked(a.position.x, a.position.z, 0.1)) gone = true;
        if (a.position.y < 0.05 || a.position.y > wallHeight + 1) gone = true;
        if (a.userData.life <= 0) gone = true;
        if (!gone) {
          for (let j = 0; j < enemies.length; j++) {
            const e = enemies[j];
            if (!e.userData.isAlive) continue;
            if (a.position.distanceTo(e.position) < e.userData.radius + 0.5) {
              damageEnemy(e, arrowDamage, a.position.x, a.position.z); gone = true; break;
            }
          }
        }
        if (gone) { scene.remove(a); arrows.splice(i, 1); }
      }

      // --- enemy shots ---
      for (let i = enemyShots.length - 1; i >= 0; i--) {
        const s = enemyShots[i];
        s.position.x += s.userData.vx; s.position.z += s.userData.vz; s.userData.life--;
        let gone = false;
        if (isPositionBlocked(s.position.x, s.position.z, 0.1) || s.userData.life <= 0) gone = true;
        const dxk = knight.position.x - s.position.x, dzk = knight.position.z - s.position.z;
        if (!gone && Math.sqrt(dxk*dxk + dzk*dzk) < knightRadius + 0.3) { takeDamage(1); gone = true; }
        if (gone) { scene.remove(s); enemyShots.splice(i, 1); }
      }

      // --- enemies ---
      for (let i = 0; i < enemies.length; i++) {
        const enemy = enemies[i];
        if (enemy.userData.isDying) {
          enemy.userData.deathTimer += 1/60;
          const pv = enemy.userData.deathTimer / 1.5;
          if (pv >= 1) { scene.remove(enemy); enemy.userData.isDying = false; }
          else {
            const flatten = 1-pv, spread = 1+pv*0.8, shrink = 1-pv;
            enemy.scale.y = flatten*0.5; enemy.scale.x = spread*shrink; enemy.scale.z = spread*shrink;
            enemy.position.y = enemy.userData.baseY * flatten;
          }
          continue;
        }
        if (!enemy.userData.isAlive) continue;
        if (enemy.userData.hitFlashTimer > 0) {
          enemy.userData.hitFlashTimer -= 1/60;
          if (enemy.userData.hitFlashTimer <= 0) enemy.material.color.setHex(enemy.userData.normalColor);
        }

        if (enemy.userData.knockbackTimer > 0) {
          enemy.userData.knockbackTimer -= 1/60;
          const nx = enemy.position.x + enemy.userData.knockbackX;
          const nz = enemy.position.z + enemy.userData.knockbackZ;
          if (!isPositionBlocked(nx, enemy.position.z, enemy.userData.radius) && !isOverPit(nx, enemy.position.z)) enemy.position.x = nx;
          else enemy.userData.knockbackX = 0;
          if (!isPositionBlocked(enemy.position.x, nz, enemy.userData.radius) && !isOverPit(enemy.position.x, nz)) enemy.position.z = nz;
          else enemy.userData.knockbackZ = 0;
          enemy.userData.knockbackX *= 0.85; enemy.userData.knockbackZ *= 0.85;
        } else if (knightState === 'alive') {
          const dx = knight.position.x - enemy.position.x;
          const dz = knight.position.z - enemy.position.z;
          const dist = Math.sqrt(dx*dx + dz*dz);
          const inSight = dist <= enemy.userData.sightRange;

          if (enemy.userData.ranged) {
            if (inSight) {
              const standoff = enemy.userData.standoff;
              let moveDir = 0;
              if (dist > standoff + 1) moveDir = 1;
              else if (dist < standoff - 1) moveDir = -1;
              if (moveDir !== 0 && dist > 0.001) {
                const sX = (dx/dist) * enemy.userData.speed * moveDir;
                const sZ = (dz/dist) * enemy.userData.speed * moveDir;
                const r = enemy.userData.radius;
                if (!isPositionBlocked(enemy.position.x+sX, enemy.position.z, r) && !isOverPit(enemy.position.x+sX, enemy.position.z)) enemy.position.x += sX;
                if (!isPositionBlocked(enemy.position.x, enemy.position.z+sZ, r) && !isOverPit(enemy.position.x, enemy.position.z+sZ)) enemy.position.z += sZ;
              }
              enemy.userData.shootTimer -= 1/60;
              if (enemy.userData.shootTimer <= 0) {
                spawnEnemyShot(enemy.position.x, enemy.position.y, enemy.position.z, knight.position.x, knight.position.z);
                enemy.userData.shootTimer = 1.6 + Math.random()*1.0;
              }
            }
            enemy.position.y = enemy.userData.baseY + Math.sin(Date.now()*0.005)*0.25;
          } else {
            if (inSight && dist > 0.5) {
              const stepX = (dx/dist) * enemy.userData.speed;
              const stepZ = (dz/dist) * enemy.userData.speed;
              const r = enemy.userData.radius;
              if (!isPositionBlocked(enemy.position.x+stepX, enemy.position.z, r) && !isOverPit(enemy.position.x+stepX, enemy.position.z)) enemy.position.x += stepX;
              if (!isPositionBlocked(enemy.position.x, enemy.position.z+stepZ, r) && !isOverPit(enemy.position.x, enemy.position.z+stepZ)) enemy.position.z += stepZ;
            }
          }
        }

        if (knight.position.distanceTo(enemy.position) < knightRadius + enemy.userData.radius) takeDamage(enemy.userData.damage);
      }

      // --- KNIGHT STATE HANDLING ---
      if (knightState === 'falling') {
        fallTimer += 1/60;
        const pv = fallTimer / fallDuration;
        if (pv >= 1) respawnKnight();
        else { knight.position.y = 0.8 - pv*2.5; knight.scale.set(1-pv*0.3, 1-pv*0.5, 1-pv*0.3); knight.rotation.z = pv*0.5; }
      } else if (knightState === 'alive') {

        if (invincibleTimer > 0) {
          invincibleTimer -= 1/60; blinkTimer += 1/60;
          if (blinkTimer > 0.1) { knight.visible = !knight.visible; blinkTimer = 0; }
          if (invincibleTimer <= 0) knight.visible = true;
        }

        if (aiming) {
          if (keys.aimLeft)  aimYaw   += 0.03;
          if (keys.aimRight) aimYaw   -= 0.03;
          if (keys.aimUp)    aimPitch += 0.03;
          if (keys.aimDown)  aimPitch -= 0.03;
          if (aimYaw > 1.2) aimYaw = 1.2; if (aimYaw < -1.2) aimYaw = -1.2;
          if (aimPitch > 1.0) aimPitch = 1.0; if (aimPitch < -0.5) aimPitch = -0.5;
        }

        const aimFactor = aiming ? 0.45 : 1;
        const turnSpeed = 0.05 * aimFactor;
        if (keys.left) knight.rotation.y += turnSpeed;
        if (keys.right) knight.rotation.y -= turnSpeed;

        let walkAmount = 0;
        if (keys.up) walkAmount = 1;
        if (keys.down) walkAmount = -0.5;
        let moveX = 0, moveZ = 0;
        if (walkAmount !== 0) {
          const forwardX = -Math.sin(knight.rotation.y), forwardZ = -Math.cos(knight.rotation.y);
          moveX = forwardX * walkAmount; moveZ = forwardZ * walkAmount;
        }
        const speed = moveSpeed * aimFactor;
        const newX = knight.position.x + moveX*speed, newZ = knight.position.z + moveZ*speed;
        if (!isPositionBlocked(newX, knight.position.z, knightRadius)) knight.position.x = newX;
        if (!isPositionBlocked(knight.position.x, newZ, knightRadius)) knight.position.z = newZ;
        if (isOverPit(knight.position.x, knight.position.z)) startFalling();

        // --- CONNECTORS ---
        if (transitionCooldown <= 0) {
          for (const door of doors) {
            if (knight.position.distanceTo(door.position) < 1.6) {
              if (door.userData.locked && playerKeys <= 0) showMessage('Locked! You need a key.', 1.0);
              else {
                if (door.userData.locked) { playerKeys -= 1; updateKeysUI(); progress.unlockedDoors.add(door.userData.id); showMessage('Unlocked the door!', 1.2); }
                loadRoom(door.userData.to, door.userData.arriveX, door.userData.arriveZ);
              }
              break;
            }
          }
          for (const st of stairsList) {
            if (knight.position.distanceTo(st.position) < 2.0) { loadRoom(st.userData.to, st.userData.arriveX, st.userData.arriveZ); break; }
          }
          for (const pr of portals) {
            if (knight.position.distanceTo(pr.position) < 2.0) {
              if (pr.userData.comingSoon) {
                if (messageTimer <= 0) showMessage(pr.userData.name + ' region \u2014 coming soon!', 1.5);
              } else {
                loadRoom(pr.userData.to, pr.userData.arriveX, pr.userData.arriveZ);
              }
              break;
            }
          }
        }

        // --- PICKUPS ---
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          const kind = item.userData.kind;
          const reach = (kind === 'treasure') ? 1.4 : 1.2;
          if (knight.position.distanceTo(item.position) < reach) {
            if (kind === 'key') {
              playerKeys += 1; updateKeysUI();
              if (item.userData.id) progress.takenKeys.add(item.userData.id);
              showMessage('Picked up a key! \uD83D\uDD11', 1.5);
            } else if (kind === 'coin') { playerCoins += 1; updateCoinsUI(); }
            else if (kind === 'arrow') { playerArrows += 5; updateAmmoUI(); showMessage('+5 arrows \uD83C\uDFF9', 1.0); }
            else if (kind === 'heart') {
              if (knightHealth >= maxHearts) continue;
              knightHealth += 1; updateHearts(); showMessage('+1 heart!', 1.0);
            } else if (kind === 'treasure') {
              if (item.userData.id) progress.tookTreasure.add(item.userData.id);
              if (item.userData.final) showMessage('\uD83C\uDFC6 Dungeon 1 cleared!', 4);
              else if (item.userData.final2) showMessage('\uD83C\uDFC6 Desert Dungeon cleared! You beat the Sand Eye King!', 4);
              else showMessage('\uD83C\uDFC6 You found the treasure!', 3);
            }
            scene.remove(item); items.splice(i, 1);
          }
        }

        // --- CHESTS ---
        for (const chest of chests) {
          if (chest.userData.opened) continue;
          if (knight.position.distanceTo(chest.position) < 1.3) {
            chest.userData.opened = true; chest.material.color.setHex(0x4a3520);
            progress.openedChests.add(chest.userData.id);
            const reward = chest.userData.reward;
            if (reward === 'coin') { playerCoins += 3; updateCoinsUI(); showMessage('Chest: +3 coins! \uD83E\uDE99', 1.6); }
            else if (reward === 'key') { playerKeys += 1; updateKeysUI(); showMessage('Chest: a key! \uD83D\uDD11', 1.6); }
            else if (reward === 'heart') { if (knightHealth < maxHearts) { knightHealth += 1; updateHearts(); } showMessage('Chest: +1 heart! \u2764\uFE0F', 1.6); }
            else if (reward === 'arrows') { playerArrows += 10; updateAmmoUI(); showMessage('Chest: +10 arrows! \uD83C\uDFF9', 1.6); }
            else if (reward === 'bow') { hasBow = true; playerArrows += 15; updateAmmoUI(); showMessage('\uD83C\uDFF9 BOW!  / shoot   . aim   IJKL move aim', 4.5); }
          }
        }

        // --- SWORD SWING ---
        if (isSwinging) {
          swingTimer += 1/60/swingDuration;
          if (swingTimer >= 1) { isSwinging = false; swingTimer = 0; cooldownTimer = swingCooldown; sword.rotation.y = -0.3; }
          else sword.rotation.y = -1.5 + swingTimer*3.0;
          if (!hasHitThisSwing) {
            for (let i = 0; i < enemies.length; i++) {
              const enemy = enemies[i];
              if (!enemy.userData.isAlive) continue;
              if (knight.position.distanceTo(enemy.position) < hitRange) {
                if (enemy.userData.meleeImmune) {
                  if (messageTimer <= 0) showMessage('Your sword can\u2019t hurt it \u2014 use the bow!', 1.2);
                  hasHitThisSwing = true;
                } else { damageEnemy(enemy, swordDamage, knight.position.x, knight.position.z); hasHitThisSwing = true; }
                break;
              }
            }
          }
        }
      }

      // --- CAMERA ---
      const camAngle = knight.rotation.y + (aiming ? aimYaw : 0);
      const dirX = Math.sin(camAngle), dirZ = Math.cos(camAngle);
      const desiredDist = aiming ? 4.0 : cameraDistance;
      let allowedDist = desiredDist;
      for (let d = minCamDist; d <= desiredDist; d += 0.25) {
        if (isPositionBlocked(knight.position.x + dirX*d, knight.position.z + dirZ*d, camClearance)) { allowedDist = d - 0.25; break; }
      }
      if (allowedDist < minCamDist) allowedDist = minCamDist;
      const distSmooth = (allowedDist < currentCamDist) ? 0.5 : 0.08;
      currentCamDist += (allowedDist - currentCamDist) * distSmooth;

      camera.position.x += (knight.position.x + dirX*currentCamDist - camera.position.x) / 0.18;
      camera.position.y = aiming ? (knight.position.y + 0.7) : (knight.position.y + cameraHeight + 1);
      camera.position.z += (knight.position.z + dirZ*currentCamDist - camera.position.z) * 0.18;

      if (aiming) {
        const cp = Math.cos(aimPitch);
        const aimX = -Math.sin(camAngle) * cp;
        const aimY = Math.sin(aimPitch);
        const aimZ = -Math.cos(camAngle) * cp;
        camera.lookAt(camera.position.x + aimX*10, camera.position.y + aimY*10, camera.position.z + aimZ*10);
      } else {
        camera.lookAt(knight.position.x, 1.6, knight.position.z);
      }

      const targetFov = aiming ? 34 : 60;
      if (Math.abs(camera.fov - targetFov) > 0.05) { camera.fov += (targetFov - camera.fov) * 0.25; camera.updateProjectionMatrix(); }

      renderer.render(scene, camera);
    }
    animate();

  </script>
