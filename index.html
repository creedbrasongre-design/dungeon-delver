<!DOCTYPE html>
<html>
<head>
  <title>Dungeon Delver</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

  <!-- Load the Three.js library -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    // =====================================================
    // DUNGEON DELVER - Phase 1: The Room
    // =====================================================

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111); // Dark background

    // --- CAMERA SETUP ---
    // Position the camera up high and angled down (Zelda-style)
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 12, 12); // (x, y, z) - up 12, back 12
    camera.lookAt(0, 0, 0);         // Look at the center of the room

    // --- RENDERER SETUP ---
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- LIGHTING ---
    // Soft overall light so nothing is pitch black
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    // Bright "torch" light from above
    const torchLight = new THREE.PointLight(0xffaa55, 1.5, 50);
    torchLight.position.set(0, 8, 0);
    scene.add(torchLight);

    // --- BUILDING THE ROOM ---
    const roomSize = 10; // The room is 10x10 units

    // FLOOR - a flat stone-colored square
    const floorGeometry = new THREE.PlaneGeometry(roomSize, roomSize);
    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2; // Rotate flat (90 degrees)
    scene.add(floor);

    // WALLS - 4 walls around the room
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x554433 });
    const wallHeight = 3;

    // Back wall
    const backWall = new THREE.Mesh(
      new THREE.BoxGeometry(roomSize, wallHeight, 0.5),
      wallMaterial
    );
    backWall.position.set(0, wallHeight / 2, -roomSize / 2);
    scene.add(backWall);

    // Front wall
    const frontWall = new THREE.Mesh(
      new THREE.BoxGeometry(roomSize, wallHeight, 0.5),
      wallMaterial
    );
    frontWall.position.set(0, wallHeight / 2, roomSize / 2);
    scene.add(frontWall);

    // Left wall
    const leftWall = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, wallHeight, roomSize),
      wallMaterial
    );
    leftWall.position.set(-roomSize / 2, wallHeight / 2, 0);
    scene.add(leftWall);

    // Right wall
    const rightWall = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, wallHeight, roomSize),
      wallMaterial
    );
    rightWall.position.set(roomSize / 2, wallHeight / 2, 0);
    scene.add(rightWall);

    // --- THE KNIGHT (our player!) ---
    // For now: a simple blue capsule shape
    const knightGeometry = new THREE.CapsuleGeometry(0.4, 0.8, 4, 8);
    const knightMaterial = new THREE.MeshStandardMaterial({ color: 0x4488ff });
    const knight = new THREE.Mesh(knightGeometry, knightMaterial);
    knight.position.set(0, 0.8, 0); // Stand on the floor
    scene.add(knight);

    // --- THE GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

  </script>

</body>
</html>
