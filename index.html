<!DOCTYPE html>
<html>
<head>
  <title>Dungeon Delver</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

  <!-- Load the Three.js library -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
    // =====================================================
    // DUNGEON DELVER - Phase 2: Movement
    // =====================================================

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // --- CAMERA SETUP ---
    // Third-person camera (OOT-style) - behind and above the knight
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 3.5, 6);
    camera.lookAt(0, 1.6, 0);

    // --- RENDERER SETUP ---
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const torchLight = new THREE.PointLight(0xffaa55, 100, 50);
    torchLight.position.set(0, 7, 0);
    scene.add(torchLight);

    const moonLight = new THREE.DirectionalLight(0xaaaaff, 0.5);
    moonLight.position.set(5, 10, 5);
    scene.add(moonLight);

    // --- BUILDING THE ROOM ---
    const roomSize = 20; // The room is 20x20 units

    // FLOOR
    const floorGeometry = new THREE.PlaneGeometry(roomSize, roomSize);
    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // WALLS
    const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x554433 });
    const wallHeight = 3;

    const backWall = new THREE.Mesh(
      new THREE.BoxGeometry(roomSize, wallHeight, 0.5),
      wallMaterial
    );
    backWall.position.set(0, wallHeight / 2, -roomSize / 2);
    scene.add(backWall);

    const frontWall = new THREE.Mesh(
      new THREE.BoxGeometry(roomSize, wallHeight, 0.5),
      wallMaterial
    );
    frontWall.position.set(0, wallHeight / 2, roomSize / 2);
    scene.add(frontWall);

    const leftWall = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, wallHeight, roomSize),
      wallMaterial
    );
    leftWall.position.set(-roomSize / 2, wallHeight / 2, 0);
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, wallHeight, roomSize),
      wallMaterial
    );
    rightWall.position.set(roomSize / 2, wallHeight / 2, 0);
    scene.add(rightWall);

    // --- THE KNIGHT (our player!) ---
    const knightGeometry = new THREE.CapsuleGeometry(0.4, 0.8, 4, 8);
    const knightMaterial = new THREE.MeshStandardMaterial({ color: 0x4488ff });
    const knight = new THREE.Mesh(knightGeometry, knightMaterial);
    knight.position.set(0, 0.8, 0);
    scene.add(knight);

    // --- KEYBOARD INPUT TRACKING ---
    // Tracks which direction the player wants to move
    const keys = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    // Helper function - handles both arrow keys AND WASD
    function setKey(event, isPressed) {
      const key = event.key;
      if (key === 'ArrowUp' || key === 'w' || key === 'W') keys.up = isPressed;
      if (key === 'ArrowDown' || key === 's' || key === 'S') keys.down = isPressed;
      if (key === 'ArrowLeft' || key === 'a' || key === 'A') keys.left = isPressed;
      if (key === 'ArrowRight' || key === 'd' || key === 'D') keys.right = isPressed;
    }

    window.addEventListener('keydown', (event) => setKey(event, true));
    window.addEventListener('keyup', (event) => setKey(event, false));

    // --- MOVEMENT SETTINGS ---
    const moveSpeed = 0.1;

    // --- THE GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Figure out which direction the player wants to move
      let moveX = 0;
      let moveZ = 0;
      if (keys.up) moveZ -= 1;      // Forward
      if (keys.down) moveZ += 1;    // Backward
      if (keys.left) moveX -= 1;    // Left
      if (keys.right) moveX += 1;   // Right

      // Are we actually moving? (Both numbers are zero = standing still)
      const isMoving = (moveX !== 0 || moveZ !== 0);

      // Apply the movement to the knight
      knight.position.x += moveX * moveSpeed;
      knight.position.z += moveZ * moveSpeed;

      // Rotate the knight to face the direction it's moving
      if (isMoving) {
        knight.rotation.y = Math.atan2(moveX, moveZ) + Math.PI;
      }

      // Make the camera follow the knight
      camera.position.x = knight.position.x;
      camera.position.z = knight.position.z + 6;
      camera.lookAt(knight.position.x, 1.6, knight.position.z);

      renderer.render(scene, camera);
    }
    animate();

  </script>

</body>
</html>
